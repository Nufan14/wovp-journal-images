<svg xmlns="http://www.w3.org/2000/svg" width="620" height="2000" viewBox="0 0 620 2000">
  <defs>
    <!-- Base color -->
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a8478"/>
      <stop offset="50%" stop-color="#827c70"/>
      <stop offset="100%" stop-color="#8a8478"/>
    </linearGradient>
    
    <!-- Subtle fold gradients -->
    <linearGradient id="fold1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    
    <linearGradient id="fold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    
    <!-- Noise filter for paper texture -->
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grayNoise"/>
      <feComponentTransfer in="grayNoise">
        <feFuncA type="linear" slope="0.15" intercept="0"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply"/>
    </filter>
  </defs>
  
  <!-- Base paper color -->
  <rect width="620" height="2000" fill="url(#base)"/>
  
  <!-- Fold 1 (horizontal, near top) -->
  <rect x="0" y="380" width="620" height="12" fill="url(#fold1)"/>
  <rect x="0" y="392" width="620" height="2" fill="#5a5548" opacity="0.3"/>
  <rect x="0" y="394" width="620" height="12" fill="url(#fold1)" transform="scale(1,-1) translate(0,-800)"/>
  
  <!-- Fold 2 (horizontal, near middle) -->
  <rect x="0" y="1180" width="620" height="12" fill="url(#fold1)"/>
  <rect x="0" y="1192" width="620" height="2" fill="#5a5548" opacity="0.3"/>
  <rect x="0" y="1194" width="620" height="12" fill="url(#fold1)" transform="scale(1,-1) translate(0,-2400)"/>
  
  <!-- Fold 3 (horizontal, near bottom) -->
  <rect x="0" y="1820" width="620" height="12" fill="url(#fold1)"/>
  <rect x="0" y="1832" width="620" height="2" fill="#5a5548" opacity="0.3"/>
  <rect x="0" y="1834" width="620" height="12" fill="url(#fold1)" transform="scale(1,-1) translate(0,-3700)"/>
  
  <!-- Subtle vertical light streaks (from paper folds) -->
  <rect x="80" y="0" width="2" height="2000" fill="#fff" opacity="0.04"/>
  <rect x="300" y="0" width="1" height="2000" fill="#fff" opacity="0.03"/>
  <rect x="480" y="0" width="2" height="2000" fill="#fff" opacity="0.04"/>
  
  <!-- Texture overlay -->
  <rect width="620" height="2000" fill="#8a8478" filter="url(#paper)" opacity="0.6"/>
</svg>